[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcomm"
version = "0.1.0"
description = "Agent-to-Agent Communication Layer: LLM-agnostic multi-agent messaging (registry, router, history, LLM adapters)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.8", "ruff>=0.4"]
llm = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["agentcomm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py311"
